[font]
normal = { family = "SauceCodePro Nerd Font", style = "Medium" }
bold = { family = "SauceCodePro Nerd Font", style = "Bold" }
size = 12

# Change the cursor to always be black text on white bg.
# This changes the default behaviour which is inverting text and bg color which doesn't work well
# in vim (highlighted text eats your cursor).
[colors.cursor]
text = "0x1d1f21"
cursor = "0xffffff"

# Default colors
[colors.primary]
background = "0x1d1f21"
foreground = "0xffffff"

# Normal colors
[colors.normal]
black =   "0x1d1f21"
red =     "0xcc342b"
green =   "0x198844"
yellow =  "0xfba922"
blue =    "0x3971ed"
magenta = "0xa36ac7"
cyan =    "0x3971ed"
white =   "0xffffff"

# Bright colors
[colors.bright]
black =   "0x969896"
red =     "0xcc342b"
green =   "0x198844"
yellow =  "0xfba922"
blue =    "0x3971ed"
magenta = "0xa36ac7"
cyan =    "0x3971ed"
white =   "0xffffff"

[window]
option_as_alt = "Both"
