[font]
normal = { family = "Source Code Pro", style = "Medium" }
bold = { family = "Source Code Pro", style = "Bold" }
size = 13

# Change the cursor to always be black text on while bg.
# This changes the default behaviour which is inverting text and bg color which doesn't work well
# in vim (highlighted text eats your cursor).
[colors.cursor]
text = "#000000"
cursor = "#FFFFFF"

# Default colors
[colors.primary]
background = "0x1d1f21"
foreground = "0xc5c8c6"

# Normal colors
[colors.normal]
black =   "0x1d1f21"
red =     "0xcc342b"
green =   "0x198844"
yellow =  "0xfba922"
blue =    "0x3971ed"
magenta = "0xa36ac7"
cyan =    "0x3971ed"
white =   "0xc5c8c6"

# Bright colors
[colors.bright]
black =   "0x969896"
red =     "0xcc342b"
green =   "0x198844"
yellow =  "0xfba922"
blue =    "0x3971ed"
magenta = "0xa36ac7"
cyan =    "0x3971ed"
white =   "0xffffff"
