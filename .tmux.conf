# change prefix to ctrl+s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

set -g mouse on
set-option -g status-position top
set -g history-limit 10000

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Removes delays
set -sg escape-time 0
set-option -g repeat-time 0

# options for better-mouse-mode
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

# Toggle window background to show focus
set -g window-active-style 'fg=terminal,bg=#1d1f21'
set -g window-style 'fg=terminal,bg=#323232'

# Force enable RGB and undercurl support
set-option -ga terminal-features ',xterm*:RGB:usstyle'

# List of plugins
set -g @tpm_plugins '                     \
    caiogondim/maglev                     \
    tmux-plugins/tpm                      \
    tmux-plugins/tmux-sensible            \
    tmux-plugins/tmux-resurrect           \
    tmux-plugins/tmux-continuum           \
    tmux-plugins/tmux-yank                \
    tmux-plugins/tmux-pain-control        \
    tmux-plugins/tmux-copycat             \
    tmux-plugins/tmux-open                \
    tmux-plugins/tmux-battery             \
    tmux-plugins/tmux-cpu                 \
    tmux-plugins/tmux-prefix-highlight    \
    christoomey/vim-tmux-navigator        \
    nhdaly/tmux-better-mouse-mode         \
'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
